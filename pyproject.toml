[project]
name = "quant-agent"
version = "0.1.0"
description = "Quantitative stock analysis agent producing pre-market valuation verdicts from the foundational equations of quantitative finance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Blake Bortolini" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "fredapi>=0.5.2",
    "statsmodels>=0.14",
    "arch>=7.0",
    "cvxpy>=1.5",
    "scikit-learn>=1.4",        # Ledoit-Wolf shrinkage estimator
    "edgartools>=3.0",          # SEC EDGAR: Form 4 insider + 13F holdings (free)
    "supabase>=2.0",            # optional sink: write run results to Supabase
    "pyarrow>=15.0",            # parquet cache backend
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "loguru>=0.7",
    "matplotlib>=3.8",         # efficient frontier chart
    "fastapi>=0.110",          # on-demand scoring worker (Render)
    "uvicorn[standard]>=0.29", # ASGI server for the worker
]

[project.scripts]
quant-agent = "quant_agent.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=quant_agent --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/quant_agent/models"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.ruff.lint.per-file-ignores]
# typer relies on function-call defaults (typer.Option/Argument) by design.
"src/quant_agent/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
